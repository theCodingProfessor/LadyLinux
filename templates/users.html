<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lady Linux - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid py-4">
    <header class="mb-4">
      <h1 class="display-5">Users</h1>
      <p class="text-muted">Account management and permissions.</p>
    </header>

    <nav id="nav-container" class="mb-4"></nav>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Current Users</h2>
            <ul class="list-group" id="userList">
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>NAME</span>
                <span class="badge user-role">Admin</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>guest</span>
                <span class="badge user-role">Standard</span>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Actions</h2>
            <div class="d-grid gap-3">
              <button class="btn btn-primary" id="addUserBtn" type="button">Add User</button>
              <button class="btn btn-primary" id="changePasswordBtn" type="button">Change Password</button>
              <button class="btn btn-primary" id="removeUserBtn" type="button">Remove User</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card">
          <div class="card-body p-4">
            <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-2 mb-3">
              <div>
                <h2 class="h4 mb-1">AI Control</h2>
                <p class="text-muted mb-0">Issue user-management prompts through the shared assistant.</p>
              </div>
              <span class="badge text-bg-secondary">Users module active</span>
            </div>

            <form id="chatForm" class="row g-3 align-items-center">
              <div class="col-12 col-lg">
                <label for="prompt" class="form-label">Assistant Prompt</label>
                <input
                  type="text"
                  id="prompt"
                  class="form-control"
                  placeholder="Example: Add a new admin named Alex"
                  autocomplete="off"
                >
              </div>
              <div class="col-12 col-lg-auto">
                <button type="submit" class="btn btn-primary w-100">Execute</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card d-none" id="chatResponseCard">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Assistant Response</h2>
            <div id="chatResponse" class="border rounded p-3 response-area"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
