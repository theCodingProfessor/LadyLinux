<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lady Linux - Firewall</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid py-4">
    <header class="mb-4">
      <h1 class="display-5">Firewall</h1>
      <p class="text-muted">Network rules and security settings.</p>
    </header>

    <nav id="nav-container" class="mb-4"></nav>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Firewall Assistant</h2>
            <form id="firewallForm" class="row g-3">
              <div class="col-12">
                <label for="firewallPrompt" class="form-label">Your question</label>
                <input
                  type="text"
                  id="firewallPrompt"
                  name="firewallPrompt"
                  class="form-control"
                  value="What are the settings for my firewall on this Linux system?"
                >
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Ask</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Response Output</h2>
            <div id="firewallResponse" class="border rounded p-3 response-area"></div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">JSON Output</h2>
            <pre id="firewallJSON" class="mb-0 rounded p-3 response-area"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
