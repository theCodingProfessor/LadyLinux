<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lady Linux</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid py-4">
    <header class="mb-4">
      <h1 class="display-5">Lady Linux</h1>
      <p class="text-muted">Describe what you want to change.</p>
    </header>

    <nav id="nav-container" class="mb-4"></nav>

    <div class="row g-4">
      <div class="col-12">
        <div class="card">
          <div class="card-body p-4">
            <form id="chatForm" class="row g-3 align-items-center">
              <div class="col-12 col-lg">
                <label for="prompt" class="form-label">Assistant Prompt</label>
                <input
                  type="text"
                  id="prompt"
                  class="form-control"
                  placeholder="Example: Show my firewall status"
                  autocomplete="off"
                >
              </div>
              <div class="col-12 col-lg-auto">
                <button type="submit" class="btn btn-primary w-100">Execute</button>
              </div>
            </form>

            <div class="mt-3">
              <span class="badge text-bg-secondary">Local model active</span>
            </div>

            <div id="chatResponse" class="border rounded p-3 mt-4 response-area"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/themes.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
